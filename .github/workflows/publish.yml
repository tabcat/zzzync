name: publish

on:
  workflow_run:
    workflows: ["ci"]
    branches: [master]  # Ensure it only triggers for pushes to master
    types:
      - completed  # fires on ANY conclusion; the job gates on success below

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Single deploy job since we're just deploying
  npm:
    # workflow_run fires on failure too, so publishing has to check the
    # conclusion itself. workflow_dispatch has no workflow_run payload.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing via OIDC
    steps:
      - uses: actions/checkout@v3
      - name: Use PNPM
        uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Check latest version
        id: check-version
        run: |
          echo "LOCAL_VERSION=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT
          echo "PUBLISHED_VERSION=$(npm view $(npm pkg get name | tr -d '"') version 2>/dev/null || echo "")" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Publish to NPM
        if: steps.check-version.outputs.LOCAL_VERSION != steps.check-version.outputs.PUBLISHED_VERSION
        run: npm publish --access public
