# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: ci

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    # 24 is the current LTS and gates the build. 26 is Current and becomes LTS
    # in October, so it runs for early warning only: a failure there must not
    # turn the checkmark red, and must not stop publish, which keys off this
    # workflow's conclusion.
    # https://nodejs.org/en/about/previous-releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24
            experimental: false
          - node-version: 26
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
    - uses: actions/checkout@v3
    - name: Use PNPM
      uses: pnpm/action-setup@v3
    - name: Use Node
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm run ci
